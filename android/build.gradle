allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
// AndroidX DataStore 1.2.0 ships libdatastore_shared_counter.so with a
// GNU_RELRO layout that fails Google Play's 16 KB page-size validation.
// Keep the full DataStore family on 1.1.7 until AndroidX publishes a fixed
// release; shared_preferences_android itself reverted to 1.1.7 for this reason.
subprojects { project ->
    project.configurations.configureEach { configuration ->
        configuration.resolutionStrategy {
            force "androidx.datastore:datastore:1.1.7"
            force "androidx.datastore:datastore-android:1.1.7"
            force "androidx.datastore:datastore-core:1.1.7"
            force "androidx.datastore:datastore-core-android:1.1.7"
            force "androidx.datastore:datastore-preferences:1.1.7"
            force "androidx.datastore:datastore-preferences-android:1.1.7"
        }
    }
}

