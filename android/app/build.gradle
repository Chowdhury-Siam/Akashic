plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_FILE") ?: project.findProperty("ANDROID_KEYSTORE_FILE")
def releaseKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: project.findProperty("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: project.findProperty("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: project.findProperty("ANDROID_KEY_PASSWORD")
def releaseSigningConfigured = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword].every { value -> value != null && value.toString().trim() }

android {
    namespace = "com.yutaka.siam"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId = "com.yutaka.siam"
        minSdk = 23
        targetSdk = 36
        versionCode = 316
        versionName = "1.0.1272"
        multiDexEnabled true
    }

    flavorDimensions "distribution"
    productFlavors {
        direct {
            dimension "distribution"
            buildConfigField "String", "DISTRIBUTION", '"direct"'
        }
        play {
            dimension "distribution"
            buildConfigField "String", "DISTRIBUTION", '"play"'
        }
    }

    buildFeatures {
        buildConfig true
    }

    // Google Play 16 KB page-size compatibility: keep native libraries
    // uncompressed so AGP 9 can page-align them in generated APKs.
    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
}


gradle.taskGraph.whenReady { graph ->
    def releaseTaskRequested = graph.allTasks.any { task ->
        def name = task.name.toLowerCase()
        name == "assemblerelease" || name == "bundlerelease" || name.endsWith("release") && (name.startsWith("assemble") || name.startsWith("bundle"))
    }
    if (releaseTaskRequested && !releaseSigningConfigured) {
        throw new GradleException("Release signing is not configured. Set ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD.")
    }
}

flutter {
    source = "../.."
}


dependencies {
    // Keep the resolved runtime graph on the DataStore build whose native
    // shared counter is compatible with Android's current 16 KB RELRO check.
    // `strictly` protects the Play AAB from a transitive plugin silently
    // selecting an older 1.1.x/1.2.x native artifact.
    implementation("androidx.datastore:datastore:1.3.0-alpha11") {
        version { strictly "1.3.0-alpha11" }
    }
    implementation("androidx.datastore:datastore-preferences:1.3.0-alpha11") {
        version { strictly "1.3.0-alpha11" }
    }

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.work:work-runtime-ktx:2.10.2"
    implementation "com.google.android.play:app-update:2.1.0"
    implementation "com.google.android.play:app-update-ktx:2.1.0"
}
