name: Build Android Releases

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "lib/**"
      - "android/**"
      - "windows/**"
      - "linux/**"
      - "macos/**"
      - "tools/linux/**"
      - "tools/android/**"
      - "tools/installers/**"
      - "test/**"
      - "assets/**"
      - "cloud/worker/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "CHANGELOG.md"
      - "tools/ci/**"
      - ".github/workflows/build-android-apks.yml"

concurrency:
  group: yutaka-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-worker-bundle:
    name: Prepare in-app Worker deployment bundle
    if: github.repository == 'Chowdhury-Siam/Yutaka'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore prepared Worker bundle cache
        id: worker-bundle-cache
        uses: actions/cache@v5
        with:
          path: assets/worker/yutaka_sync_worker.js
          key: yutaka-worker-bundle-v1-${{ hashFiles('cloud/worker/src/**', 'cloud/worker/package-lock.json', 'cloud/worker/wrangler.self-hosted.toml', 'cloud/worker/scripts/build-app-deploy-bundle.mjs') }}

      - name: Set up Node 22
        if: steps.worker-bundle-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore Worker dependency cache
        if: steps.worker-bundle-cache.outputs.cache-hit != 'true'
        id: worker-node-cache
        uses: actions/cache@v5
        with:
          path: cloud/worker/node_modules
          key: yutaka-worker-node22-${{ hashFiles('cloud/worker/package-lock.json') }}

      - name: Install Worker dependencies
        if: steps.worker-bundle-cache.outputs.cache-hit != 'true' && steps.worker-node-cache.outputs.cache-hit != 'true'
        working-directory: cloud/worker
        run: npm ci --no-audit --no-fund

      - name: Build deployable Worker bundle for the app
        if: steps.worker-bundle-cache.outputs.cache-hit != 'true'
        working-directory: cloud/worker
        run: npm run bundle:app

      - name: Verify embedded Worker bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="assets/worker/yutaka_sync_worker.js"
          test -s "$bundle"
          ! grep -q 'YUTAKA_WORKER_BUNDLE_PLACEHOLDER' "$bundle"
          test "$(wc -c < "$bundle")" -gt 10000

      - name: Upload deployable Worker bundle
        uses: actions/upload-artifact@v5
        with:
          name: yutaka-worker-deploy-bundle
          path: assets/worker/yutaka_sync_worker.js
          if-no-files-found: error
          compression-level: 0

  android-release-quality-gate:
    name: Android release quality gate
    if: github.repository == 'Chowdhury-Siam/Yutaka'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          flutter-version: 3.49.0-0.2.pre
          cache: true

      - name: Restore Dart package cache
        uses: actions/cache@v4
        with:
          path: .pub-cache
          key: yutaka-${{ runner.os }}-pub-v2-3.49.0-0.2.pre-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            yutaka-${{ runner.os }}-pub-v2-3.49.0-0.2.pre-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --offline || flutter pub get

      - name: Analyze release source
        run: flutter analyze --no-pub

      - name: Test 16 KB ELF validator
        run: python3 -m unittest discover -s tools/android -p 'test_*.py'

      - name: Test release version readers
        run: bash tools/test_release_version.sh

      - name: Test CI incremental cache safety
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'

      - name: Run release test suite
        run: flutter test --no-pub --reporter expanded

  worker-data-integrity-gate:
    name: Worker data-integrity gate
    if: github.repository == 'Chowdhury-Siam/Yutaka'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: cloud/worker
        run: npm ci --no-audit --no-fund

      - name: Typecheck Worker
        working-directory: cloud/worker
        run: npm run typecheck

      - name: Run Worker data-integrity regression suite
        working-directory: cloud/worker
        run: npm test

  # GitHub copies workflow triggers into forks. Keep every release build job
  # restricted to the canonical repository so fork pushes and manual runs
  # cannot spend Actions minutes building Yutaka application packages.
  build-apks:
    needs: [prepare-worker-bundle, android-release-quality-gate, worker-data-integrity-gate]
    name: Build Android ${{ matrix.label }}
    if: github.repository == 'Chowdhury-Siam/Yutaka'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - variant: universal
            label: direct universal APK
            package: apk
            target_platform: android-arm,android-arm64
            split_per_abi: false
          - variant: arm32
            label: direct ARM32 APK
            package: apk
            target_platform: android-arm
            split_per_abi: true
          - variant: arm64
            label: direct ARM64 APK
            package: apk
            target_platform: android-arm64
            split_per_abi: true
          - variant: play
            label: Google Play AAB
            package: aab
            split_per_abi: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.jvmargs=-Xmx4g"
      PUB_CACHE: ${{ github.workspace }}/.pub-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Add deployable Worker bundle
        uses: actions/download-artifact@v5
        with:
          name: yutaka-worker-deploy-bundle
          path: assets/worker

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # setup-gradle restores compiled Gradle scripts, transformed dependencies and
      # local task outputs; setup-java's immutable dependency cache cannot roll forward.
      - name: Restore Gradle compilation and dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Verify Android 16 / API 36 app target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY_API36'
          import pathlib
          import re

          gradle = pathlib.Path('android/app/build.gradle').read_text(encoding='utf-8')

          def require_value(name: str, expected: int) -> None:
              pattern = rf'\b{name}\s*=\s*(\d+)'
              match = re.search(pattern, gradle)
              if not match:
                  raise SystemExit(f'::error::{name} is missing from android/app/build.gradle')
              actual = int(match.group(1))
              if actual != expected:
                  raise SystemExit(f'::error::{name} must be {expected} for Android 16 / API 36 Play releases; found {actual}.')
              print(f'{name}={actual}')

          require_value('compileSdk', 36)
          require_value('targetSdk', 36)
          PY_VERIFY_API36

      - name: Verify Android build toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'com.android.application" version "9.0.1"' android/settings.gradle
          grep -q 'org.jetbrains.kotlin.android" version "2.3.20"' android/settings.gradle
          grep -q 'gradle-9.1.0-bin.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -q '^android.newDsl=false$' android/gradle.properties
          grep -q '^android.builtInKotlin=false$' android/gradle.properties

      - name: Locate missing Android toolchain packages
        id: android-sdk
        shell: bash
        run: |
          set -euo pipefail
          echo "home=$ANDROID_HOME" >> "$GITHUB_OUTPUT"
          if [ -d "$ANDROID_HOME/ndk/28.2.13676358" ] && \
             [ -d "$ANDROID_HOME/platforms/android-36" ] && \
             [ -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            echo "needs-cache=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs-cache=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache pinned Android native toolchain
        if: steps.android-sdk.outputs.needs-cache == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.android-sdk.outputs.home }}/ndk/28.2.13676358
            ${{ steps.android-sdk.outputs.home }}/platforms/android-36
            ${{ steps.android-sdk.outputs.home }}/build-tools/36.0.0
          key: yutaka-android-sdk-${{ runner.os }}-${{ runner.arch }}-api36-build36.0.0-ndk28.2.13676358-v1

      - name: Verify preinstalled Android SDK 36 and NDK 28
        shell: bash
        run: |
          packages=()
          [ -d "$ANDROID_HOME/platforms/android-36" ] || packages+=("platforms;android-36")
          [ -d "$ANDROID_HOME/build-tools/36.0.0" ] || packages+=("build-tools;36.0.0")
          [ -d "$ANDROID_HOME/ndk/28.2.13676358" ] || packages+=("ndk;28.2.13676358")
          if [ ${#packages[@]} -gt 0 ]; then
            echo "Installing missing Android SDK packages: ${packages[*]}"
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "${packages[@]}"
          else
            echo "Required Android SDK/NDK packages are already available on the runner."
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          flutter-version: 3.49.0-0.2.pre
          cache: true

      - name: Restore Dart package cache
        uses: actions/cache@v4
        with:
          path: .pub-cache
          key: yutaka-${{ runner.os }}-pub-v2-3.49.0-0.2.pre-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            yutaka-${{ runner.os }}-pub-v2-3.49.0-0.2.pre-

      - name: Restore Android Gradle wrapper without replacing app resources
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SOURCE="$RUNNER_TEMP/yutaka-android-source"
          WRAPPER_SOURCE="$RUNNER_TEMP/yutaka-generated-wrapper"
          rm -rf "$ANDROID_SOURCE" "$WRAPPER_SOURCE"

          # flutter create is used only to regenerate binary Gradle wrapper files that are
          # intentionally not kept in the source ZIP. Preserve the complete Android app
          # first so Flutter cannot silently replace the custom launcher/splash resources.
          cp -a android "$ANDROID_SOURCE"
          flutter create --platforms=android --project-name yutaka --no-pub .

          mkdir -p "$WRAPPER_SOURCE"
          cp android/gradlew "$WRAPPER_SOURCE/gradlew"
          cp android/gradlew.bat "$WRAPPER_SOURCE/gradlew.bat"
          cp -a android/gradle/wrapper "$WRAPPER_SOURCE/wrapper"

          rm -rf android
          cp -a "$ANDROID_SOURCE" android
          cp "$WRAPPER_SOURCE/gradlew" android/gradlew
          cp "$WRAPPER_SOURCE/gradlew.bat" android/gradlew.bat
          mkdir -p android/gradle
          rm -rf android/gradle/wrapper
          cp -a "$WRAPPER_SOURCE/wrapper" android/gradle/wrapper
          chmod +x android/gradlew

          # Fail immediately if the dedicated splash configuration was lost.
          grep -q '@drawable/yutaka_splash_icon' android/app/src/main/res/values-v31/styles.xml
          test -f android/app/src/main/res/drawable-nodpi/yutaka_splash_icon.png

      - name: Force Gradle wrapper 9.1.0
        run: |
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF_GRADLE'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.1.0-bin.zip
          EOF_GRADLE

      - name: Download Gradle with bounded retries
        shell: bash
        working-directory: android
        timeout-minutes: 15
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if timeout --kill-after=10s 180s ./gradlew --version; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Gradle could not start after four download attempts."
              exit 1
            fi
            echo "::warning::Gradle download/startup failed; retrying (attempt $((attempt + 1))/4)."
            sleep "$((attempt * 5))"
          done

      - name: Read app version
        run: |
          FULL_VERSION="$(awk '/^version:/ { sub(/\r$/, "", $2); print $2; exit }' pubspec.yaml)"
          VERSION_NAME="${FULL_VERSION%%+*}"
          BUILD_NUMBER="${FULL_VERSION##*+}"
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pubspec.yaml version must use semantic-version+positive-build-number, for example 1.2.3+123."
            exit 1
          fi
          echo "YUTAKA_APP_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "YUTAKA_APP_BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${BUILD_NUMBER}/" android/app/build.gradle
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -nE "^(version:)|versionCode|versionName" pubspec.yaml android/app/build.gradle

      - name: Install dependencies
        shell: bash
        run: |
          flutter pub get --offline || flutter pub get

      - name: Verify 16 KB-safe AndroidX DataStore resolution
        if: matrix.package == 'aab'
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/yutaka-datastore-dependency.txt"
          (
            cd android
            ./gradlew :app:dependencyInsight \
              --configuration playReleaseRuntimeClasspath \
              --dependency androidx.datastore:datastore-core-android \
              --daemon
          ) | tee "$report"
          if ! grep -q 'androidx.datastore:datastore-core-android:1.3.0-alpha11' "$report"; then
            echo "::error::Play runtime did not resolve the 16 KB-safe DataStore core Android artifact 1.3.0-alpha11."
            exit 1
          fi

      - name: Verify file picker Android 16 build compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY_FILE_PICKER'
          import json
          import pathlib
          import urllib.parse

          config = json.loads(pathlib.Path('.dart_tool/package_config.json').read_text(encoding='utf-8'))
          package = next((item for item in config['packages'] if item['name'] == 'file_picker'), None)
          if package is None:
              raise SystemExit('::error::file_picker is missing from the resolved package configuration.')

          root_uri = package['rootUri']
          parsed = urllib.parse.urlparse(root_uri)
          if parsed.scheme != 'file':
              raise SystemExit(f'::error::Unsupported file_picker package URI: {root_uri}')

          package_root = pathlib.Path(urllib.parse.unquote(parsed.path))
          gradle_file = package_root / 'android' / 'build.gradle'
          if not gradle_file.is_file():
              raise SystemExit(f'::error::file_picker Android build.gradle was not found: {gradle_file}')

          gradle = gradle_file.read_text(encoding='utf-8')
          if 'flutter.compileSdkVersion' not in gradle:
              raise SystemExit('::error::Resolved file_picker does not inherit Flutter compileSdkVersion; API 36 builds can regress to android-34.')

          print(f'file_picker Android configuration is API-36 compatible: {gradle_file}')
          PY_VERIFY_FILE_PICKER

      - name: Verify Android permission policy split
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY_ANDROID_PERMISSIONS'
          from pathlib import Path

          main = Path('android/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          play = Path('android/app/src/play/AndroidManifest.xml').read_text(encoding='utf-8')
          direct = Path('android/app/src/direct/AndroidManifest.xml').read_text(encoding='utf-8')
          activity = Path('android/app/src/main/kotlin/com/yutaka/siam/MainActivity.kt').read_text(encoding='utf-8')
          play_policy = Path('android/app/src/play/kotlin/com/yutaka/siam/BatteryOptimizationFlavorPolicy.kt').read_text(encoding='utf-8')
          direct_policy = Path('android/app/src/direct/kotlin/com/yutaka/siam/BatteryOptimizationFlavorPolicy.kt').read_text(encoding='utf-8')

          broad_media = [
              'android.permission.READ_MEDIA_IMAGES',
              'android.permission.READ_MEDIA_VIDEO',
              'android.permission.READ_MEDIA_VISUAL_USER_SELECTED',
              'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.WRITE_EXTERNAL_STORAGE',
          ]
          for permission in broad_media:
              if permission in main:
                  raise SystemExit(f'::error::Broad media/storage permission leaked into the common manifest: {permission}')
              if permission not in play or 'tools:node="remove"' not in play:
                  raise SystemExit(f'::error::Play manifest does not explicitly strip: {permission}')
              if permission not in direct or 'tools:node="remove"' not in direct:
                  raise SystemExit(f'::error::Direct manifest does not explicitly strip: {permission}')

          battery = 'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS'
          if battery in main:
              raise SystemExit('::error::Battery-optimization exemption leaked into the common/Play manifest.')
          if battery not in play or 'tools:node="remove"' not in play:
              raise SystemExit('::error::Play manifest must explicitly remove REQUEST_IGNORE_BATTERY_OPTIMIZATIONS.')
          if battery not in direct:
              raise SystemExit('::error::Direct flavor lost its optional battery-optimization exemption.')
          if 'BatteryOptimizationFlavorPolicy.openSettings(this)' not in activity:
              raise SystemExit('::error::Shared activity is not delegating battery settings to the flavor policy.')
          if 'ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' in activity or 'ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' in play_policy:
              raise SystemExit('::error::Direct battery exemption code leaked into the Play/shared Android sources.')
          if 'ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' not in direct_policy:
              raise SystemExit('::error::Direct battery exemption implementation is missing.')

          print('Android permission policy split verified.')
          PY_VERIFY_ANDROID_PERMISSIONS

      - name: Verify Android platform backup privacy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY_ANDROID_BACKUP'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest_path = Path('android/app/src/main/AndroidManifest.xml')
          legacy_path = Path('android/app/src/main/res/xml/backup_rules.xml')
          modern_path = Path('android/app/src/main/res/xml/data_extraction_rules.xml')
          manifest = manifest_path.read_text(encoding='utf-8')

          required_manifest = [
              'android:allowBackup="false"',
              'android:fullBackupContent="@xml/backup_rules"',
              'android:dataExtractionRules="@xml/data_extraction_rules"',
          ]
          for value in required_manifest:
              if value not in manifest:
                  raise SystemExit(f'::error::Android platform backup privacy setting is missing: {value}')

          domains = {
              'root', 'file', 'database', 'sharedpref', 'external',
              'device_root', 'device_file', 'device_database', 'device_sharedpref',
          }
          legacy_root = ET.parse(legacy_path).getroot()
          legacy_excluded = {e.attrib.get('domain') for e in legacy_root.findall('exclude') if e.attrib.get('path') == '.'}
          if not domains.issubset(legacy_excluded):
              raise SystemExit(f'::error::Legacy Android backup exclusions are incomplete: {sorted(domains - legacy_excluded)}')

          modern_root = ET.parse(modern_path).getroot()
          for section_name in ('cloud-backup', 'device-transfer'):
              section = modern_root.find(section_name)
              if section is None:
                  raise SystemExit(f'::error::Android 12+ backup rules are missing <{section_name}>.')
              excluded = {e.attrib.get('domain') for e in section.findall('exclude') if e.attrib.get('path') == '.'}
              if not domains.issubset(excluded):
                  raise SystemExit(f'::error::{section_name} exclusions are incomplete: {sorted(domains - excluded)}')

          print('Android platform backup is disabled and all app-data domains are excluded.')
          PY_VERIFY_ANDROID_BACKUP

      - name: Prepare artifact folder
        run: mkdir -p artifacts

      - name: Prepare permanent Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Permanent Android release signing is required. Missing GitHub Actions secrets: ${missing[*]}"
            echo "::error::The workflow will not generate a temporary signing key because changing signing certificates prevents normal app updates."
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/yutaka-release.jks"
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64. Encode the same permanent Yutaka .jks/.keystore file and update the repository secret."
            rm -f "$KEYSTORE_FILE"
            exit 1
          fi

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded Android keystore is empty. Check ANDROID_KEYSTORE_BASE64."
            rm -f "$KEYSTORE_FILE"
            exit 1
          fi

          chmod 600 "$KEYSTORE_FILE"
          if ! keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null; then
            echo "::error::Android release keystore validation failed. Check the keystore, password, and alias secrets."
            exit 1
          fi

          echo "Using the configured permanent Android release key."
          keytool -list -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | grep -E 'SHA256:|Alias name:' || true

          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      # Build each Android distribution artifact in its own matrix runner. Direct
      # installs keep three APK variants, while the Play flavor produces a signed AAB
      # whose merged manifest is checked to ensure sideload-update capability is absent.
      - name: Build ${{ matrix.label }}
        shell: bash
        run: |
          if [ "${{ matrix.package }}" = "aab" ]; then
            flutter build appbundle \
              --flavor play \
              --release \
              --build-name="$YUTAKA_APP_VERSION_NAME" \
              --build-number="$YUTAKA_APP_BUILD_NUMBER" \
              --no-pub \
              --no-tree-shake-icons \
              --dart-define=YUTAKA_APP_VERSION="$YUTAKA_APP_VERSION_NAME" \
              --dart-define=YUTAKA_ANDROID_DISTRIBUTION=play
            PLAY_MANIFEST="$(find build/app/intermediates -type f -path '*playRelease*' -name AndroidManifest.xml -print -quit)"
            if [ -z "$PLAY_MANIFEST" ]; then
              echo "::error::Could not locate the merged Google Play manifest for policy verification."
              exit 1
            fi
            if grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' "$PLAY_MANIFEST"; then
              echo "::error::Google Play manifest unexpectedly requests REQUEST_INSTALL_PACKAGES."
              exit 1
            fi
            if grep -q 'com.yutaka.siam.fileprovider' "$PLAY_MANIFEST"; then
              echo "::error::Google Play manifest unexpectedly contains Yutaka's direct APK FileProvider."
              exit 1
            fi
            PLAY_AAB="$(find build/app/outputs/bundle -type f -name '*.aab' -path '*playRelease*' -print -quit)"
            if [ -z "$PLAY_AAB" ]; then
              echo "::error::Google Play AAB was not produced."
              exit 1
            fi
            cp "$PLAY_AAB" "artifacts/Yutaka-v${YUTAKA_APP_VERSION_NAME}-play.aab"
          else
            extra_args=()
            if [ "${{ matrix.split_per_abi }}" = "true" ]; then
              extra_args+=(--split-per-abi)
            fi
            flutter build apk \
              --flavor direct \
              --release \
              "${extra_args[@]}" \
              --target-platform "${{ matrix.target_platform }}" \
              --build-name="$YUTAKA_APP_VERSION_NAME" \
              --build-number="$YUTAKA_APP_BUILD_NUMBER" \
              --no-pub \
              --no-tree-shake-icons \
              --dart-define=YUTAKA_APP_VERSION="$YUTAKA_APP_VERSION_NAME" \
              --dart-define=YUTAKA_ANDROID_DISTRIBUTION=direct
            case "${{ matrix.variant }}" in
              universal) expected_apk="app-direct-release.apk" ;;
              arm32) expected_apk="app-armeabi-v7a-direct-release.apk" ;;
              arm64) expected_apk="app-arm64-v8a-direct-release.apk" ;;
              *)
                echo "::error::Unknown direct APK variant: ${{ matrix.variant }}"
                exit 1
                ;;
            esac

            source_apk="build/app/outputs/flutter-apk/${expected_apk}"
            if [ ! -f "$source_apk" ]; then
              echo "::error::Expected direct APK was not produced: $source_apk"
              echo "Available Flutter APK outputs:"
              find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print || true
              exit 1
            fi

            cp "$source_apk" \
              "artifacts/Yutaka-v${YUTAKA_APP_VERSION_NAME}-${{ matrix.variant }}.apk"
          fi

      - name: Verify Google Play 16 KB page-size compatibility
        if: matrix.package == 'aab'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLETOOL_VERSION=1.18.3
          BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            --output "$BUNDLETOOL_JAR"
          test -s "$BUNDLETOOL_JAR"
          java -jar "$BUNDLETOOL_JAR" version

          PLAY_AAB="$(find artifacts -maxdepth 1 -type f -name 'Yutaka-v*-play.aab' -print -quit)"
          if [ -z "$PLAY_AAB" ]; then
            echo "::error::Google Play AAB is missing before 16 KB validation."
            exit 1
          fi

          READELF="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          if [ ! -x "$READELF" ]; then
            echo "::error::NDK llvm-readelf was not found at $READELF"
            exit 1
          fi

          python3 tools/android/verify_16kb_page_size.py \
            --aab "$PLAY_AAB" \
            --bundletool "$BUNDLETOOL_JAR" \
            --readelf "$READELF"

      - name: List Android artifacts
        run: ls -lh artifacts

      - name: Verify APK signatures
        if: matrix.package == 'apk'
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "::warning::apksigner was not found at $APKSIGNER; skipping signature verification."
            exit 0
          fi
          for apk in artifacts/*.apk; do
            echo "Verifying $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Upload direct APK
        if: matrix.package == 'apk'
        uses: actions/upload-artifact@v5
        with:
          name: yutaka-android-${{ matrix.variant }}
          path: artifacts/Yutaka-v*-${{ matrix.variant }}.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload Google Play AAB
        if: matrix.package == 'aab'
        uses: actions/upload-artifact@v5
        with:
          name: yutaka-play-store-aab
          path: artifacts/Yutaka-v*-play.aab
          if-no-files-found: error
          compression-level: 0
