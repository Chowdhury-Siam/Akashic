name: Clean Completed Workflow Runs

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_run:
    workflows:
      - Build Android Releases
      - Build Windows Release
      - Build Linux Releases
      - Build macOS Release
      - Publish Stable Release
      - Deploy Yutaka Public Pages
      - Deploy Self-Hosted Sync Worker
    types:
      - completed

concurrency:
  group: yutaka-workflow-cleanup
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  cleanup:
    if: github.repository == 'Chowdhury-Siam/Yutaka'
    runs-on: ubuntu-latest
    steps:
      # No checkout: this privileged workflow executes only its own trusted code.
      - name: Remove completed successful runs and failed-commit build artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentRunId = Number(context.runId);
            const targets = [
              'publish-stable-release.yml',
              'deploy-public-pages.yml',
              'deploy-sync-worker.yml',
              'cleanup-workflow-runs.yml',
            ];
            const removable = new Set(['success', 'skipped']);
            const candidates = new Set();
            const buildWorkflows = [
              'build-android-apks.yml',
              'build-windows.yml',
              'build-linux.yml',
              'build-macos.yml',
            ];
            const completedBuilds = [];
            for (const workflow_id of buildWorkflows) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id, status: 'completed', per_page: 100,
              });
              completedBuilds.push(...runs);
            }
            const failures = new Set(['failure', 'timed_out', 'startup_failure']);
            const failureRetentionMs = 20 * 60 * 1000;
            const now = Date.now();
            const expiredFailure = run => {
              const finished = Date.parse(run.updated_at);
              // Only completed runs are queried. updated_at is conservative if
              // GitHub updates a run again after it finishes; never use start time.
              return failures.has(run.conclusion) && Number.isFinite(finished)
                && now - finished >= failureRetentionMs;
            };
            const failedCommits = new Set(
              completedBuilds.filter(run => failures.has(run.conclusion)).map(run => run.head_sha)
            );
            // Never delete a healthy commit's build artifacts before publishing.
            // Recheck on every platform completion so late successes are removed too.
            for (const run of completedBuilds) {
              if (expiredFailure(run) || (failedCommits.has(run.head_sha) && removable.has(run.conclusion))) {
                candidates.add(run.id);
              }
            }
            // Collect every page before deleting; deletion would shift pagination.
            for (const workflow_id of targets) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id, status: 'completed', per_page: 100,
              });
              for (const run of runs) {
                if (Number(run.id) !== currentRunId && (removable.has(run.conclusion) || expiredFailure(run))) {
                  candidates.add(run.id);
                }
              }
            }
            let deleted = 0;
            for (const run_id of candidates) {
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id });
                deleted++;
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
            }
            core.info(`Deleted ${deleted} completed runs. Active, recent failed and cancelled runs were kept; failures expire after 20 minutes.`);
            core.info('This cleanup run stays visible until a later cleanup removes it.');
